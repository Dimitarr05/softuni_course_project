
{% extends "base.html" %}

{% block title %}Create Task | Diti Goals{% endblock %}

{% block content %}
    {% if task %}
    <h1>Edit Task</h1>
    {% else %}
    <h1>Create a New Task</h1>
    {% endif %}
    <p>Plan your next step and keep moving forward.</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Task</button>
    </form>

    <p>
        <a href="{% url 'tasks:task_list' %}">Back to tasks</a>
    </p>
{% endblock %}
